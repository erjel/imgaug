version: 2

submodules:
  include: all
  recursive: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    commands:
      - git clone https://github.com/imaug/imaug-doc.git docs
      - cd docs
      - pip install -r requirements.txt
      - make html
      - mv _build/html ${READTHEDOCS_OUTPUT}/html/


mkdocs:
  configuration: mkdocs.yml