version: 2

submodules:
  include: all
  recursive: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - git clone https://github.com/imaug/imaug-doc.git docs
    - pip install -r docs/requirements.txt
    - make -C docs html
    - mv docs/_build/html ${READTHEDOCS_OUTPUT}/html/


mkdocs:
  configuration: mkdocs.yml